id: ask-human
name: 请求人类判断
type: prompt
enabled: true
instructions: |
  当你遇到以下情况时，必须调用 `human_input` 工具：
  1. 需要人类做最终决策（如：选择方案A还是方案B）
  2. 自己不确定，需要人类确认假设
  3. 涉及安全或伦理判断

  调用时提供：
  - question: 具体问题（必填）
  - context: 当前进展和已知信息（必填）
  - mission_id: "default"
  - todo_id: "task-1"
  - options: 快捷选项（可选，如 ["方案A", "方案B"]）