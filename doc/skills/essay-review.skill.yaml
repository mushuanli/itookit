instructions: |
  # 中学生作文审查分析技能

  ## 技能描述

  本技能用于对中学生作文进行系统性审查与诊断分析。通过**聚焦度、立意深度、素材运用、结构完整性、语言表达**五个维度，对作文进行逐层拆解，定位亮点与问题，输出结构化的分析报告，并提供具体可操作的修改建议与示范。

  适用于读后感、记叙文、议论文、写景状物、主题作文等中学阶段常见文体。

  ---

  ## 审查流程

  ### 第一步：识别基本信息

  明确作文的题目、文体、字数、写作背景（如命题作文还是自由写作），为后续分析确定评判框架和侧重点。

  ### 第二步：五维逐项审查

  #### 1. 聚焦度

  判断全文是否围绕一个核心观点展开。

  - 能否用一句话概括全文核心？
  - 是否存在与主旨无关的段落或素材？
  - 标题与正文是否匹配？

  #### 2. 立意深度

  评估主旨的思辨性与层次感。

  | 层级 | 特征 |
  |------|------|
  | 表层 | 就事论事，停留在感受描述 |
  | 中层 | 提炼出一对矛盾关系（变与不变、继承与创新等） |
  | 深层 | 从个人延伸至社会或哲理，形成递进 |

  - 是否存在辩证思考？
  - 感悟是否有至少两个层次的递进？

  #### 3. 素材运用

  审查证据的充分性、准确性与关联性。

  | 素材类型 | 审查重点 |
  |----------|----------|
  | 原文引用 | 是否精准、是否与论点关联 |
  | 事实举例 | 是否具体、典型 |
  | 个人经历 | 是否真实、有画面感、与主旨映照 |
  | 知识拓展 | 是否自然贴切，而非生硬堆砌 |

  #### 4. 结构完整性

  检查文章骨架与内在节奏。

  | 部分 | 审查标准 |
  |------|----------|
  | 开头 | 前三句是否亮出核心话题，是否有吸引力 |
  | 中间 | 段落间是否有逻辑关系，段内是否有节奏 |
  | 结尾 | 是否呼应开头，是否有升华 |
  | 过渡 | 段落衔接是否自然 |

  #### 5. 语言表达

  评估语言的准确性、生动性、得体性与个人风格。

  - 是否存在病句、搭配不当？
  - 是否有画面感的描写和恰当修辞？
  - 语体是否与文体匹配？
  - 是否有个人化的表达，而非模板套话？

  ### 第三步：生成诊断报告

  按以下模板输出：

  ```
  【作文基本信息】
  题目：___  文体：___  字数：___

  【总体评价】（一句话概括）

  【各维度诊断】
  1. 聚焦度：⭐⭐⭐☆☆ —（说明）
  2. 立意深度：⭐⭐☆☆☆ —（说明）
  3. 素材运用：⭐⭐⭐⭐☆ —（说明）
  4. 结构完整性：⭐⭐⭐☆☆ —（说明）
  5. 语言表达：⭐⭐⭐☆☆ —（说明）

  【最大亮点】（引用原文说明）

  【首要改进项】（1-2个关键问题+具体修改建议）

  【修改示范】（原文→修改后对比）
  ```

  ---

  ## 不同文体的审查侧重

  | 文体 | 重点维度 | 特别关注 |
  |------|----------|----------|
  | 读后感 | 立意深度、素材运用 | 是否有原文依据？是否避免大量复述？感悟是否分层？ |
  | 记叙文 | 聚焦度、语言表达 | 是否有核心事件？描写是否有画面感？ |
  | 议论文 | 立意深度、结构完整性 | 论点是否鲜明？论证是否有逻辑？ |
  | 写景状物 | 语言表达、聚焦度 | 观察是否细致？是否有独特视角？ |
  | 主题作文 | 素材运用、立意深度 | 素材是否多元？是否超越表面描写？ |

  ---

  ## 审查原则

  1. **先亮点后问题**——保护写作信心
  2. **定位到具体语句**——不说空话
  3. **建议可操作**——附修改示范
  4. **每次聚焦1-2个核心改进点**——避免全面批评令学生无从下手

