version: 1
name: feature-development
goal: 分析项目并产出实现建议

workspace:
  root: ../..
  state_dir: .mindos

providers:
  - id: anthropic
    name: Anthropic
    implementation: anthropic
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
    models:
      - id: claude-sonnet-4-6
        name: Claude Sonnet
        tier: standard
        supports_tools: true

connections:
  - id: default
    provider: anthropic
    tiers:
      standard: claude-sonnet-4-6

agents:
  - id: analyst
    name: Analyst
    connection: default
    model_tier: standard
    system_prompt: 分析现有实现并给出有证据的结论。
    tools: [file_read, glob_search, grep_search]

  - id: developer
    name: Developer
    connection: default
    model_tier: standard
    system_prompt: 根据输入完成实现，并运行必要测试。
    tools: [file_read, file_write, file_edit, glob_search, grep_search, bash]

tasks:
  - id: analyze
    agent: analyst
    description: 分析与目标相关的代码，输出实施建议。
    workspace_access: read
    outputs:
      result: text

  - id: implement
    agent: developer
    description: 根据分析建议完成目标并验证。
    depends_on: [analyze]
    inputs:
      analysis: ${tasks.analyze.outputs.result}
    workspace_access: write
    outputs:
      result: text

result:
  task: implement
  output: result

runtime:
  max_concurrency: 4
  max_duration: 1h

sandbox:
  mode: oci
  engine: auto
  image: mindos-sandbox:v1
  network: none
  limits:
    cpus: 2
    memory: 2g
    pids: 256
