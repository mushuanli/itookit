[package]
name    = "tauri-app"
version = "0.1.0"
edition = "2021"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri               = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs     = "2"
tauri-plugin-sql    = { version = "2", features = ["sqlite"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"

[profile.release]
panic   = "abort"
codegen-units = 1
lto     = true
opt-level = "s"
strip   = true
